<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multithreading Basics — Revision | Engineering Digest</title>
<style>
  :root {
    --bg: #0b0f17; --bg2: #111827; --card: #151c2c; --card2: #1a2338;
    --border: #263148; --text: #e6edf7; --muted: #93a1b8;
    --accent: #6c8cff; --accent2: #2dd4bf; --good: #34d399;
    --bad: #f87171; --warn: #fbbf24; --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px 80px; }

  .topbar { position: sticky; top: 0; z-index: 50; background: rgba(11,15,23,.85); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 12px 0; }
  .topbar-inner { max-width: 880px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .topbar h1 { font-size: 15px; font-weight: 700; letter-spacing: .2px; }
  .topbar .src { font-size: 11px; color: var(--muted); }
  .back-link { font-size: 12px; color: var(--accent); text-decoration: none; font-weight: 700; border: 1px solid var(--border); background: var(--card); padding: 5px 12px; border-radius: 99px; }
  .back-link:hover { border-color: var(--accent); }
  .progress-track { flex: 1; min-width: 120px; height: 8px; background: var(--bg2); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
  .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .4s ease; border-radius: 99px; }
  .progress-label { font-size: 11px; color: var(--muted); min-width: 30px; text-align: right; }

  section { margin-top: 44px; scroll-margin-top: 80px; }
  .sec-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
  .sec-num { font-size: 12px; font-weight: 700; color: var(--accent); border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: 2px 9px; }
  .sec-head h2 { font-size: 21px; font-weight: 800; }
  .sec-sub { color: var(--muted); font-size: 13.5px; margin-bottom: 16px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; }
  .card h3 { font-size: 15.5px; margin-bottom: 8px; }
  .card p { color: #c7d2e4; font-size: 14.5px; }
  .card .hinglish { color: var(--muted); font-style: italic; font-size: 13px; margin-top: 8px; }
  .hl { color: var(--accent2); font-weight: 600; }
  .hl-p { color: #a78bfa; font-weight: 600; }
  code.inline { background: #0d1424; border: 1px solid var(--border); padding: 1px 7px; border-radius: 6px; font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; color: var(--accent2); }
  .badge { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .8px; padding: 3px 9px; border-radius: 99px; margin-left: 10px; vertical-align: middle; }
  .badge.video { background: rgba(108,140,255,.15); color: var(--accent); border: 1px solid rgba(108,140,255,.4); }
  .badge.bonus { background: rgba(167,139,250,.12); color: #a78bfa; border: 1px solid rgba(167,139,250,.4); }

  ul.clean { list-style: none; }
  ul.clean li { padding: 7px 0 7px 26px; position: relative; color: #c7d2e4; font-size: 14.5px; }
  ul.clean li::before { content: "▸"; position: absolute; left: 6px; color: var(--accent); font-weight: 700; }

  .done-row { display: flex; justify-content: flex-end; margin-top: 4px; }
  .done-btn { cursor: pointer; user-select: none; font-size: 12.5px; font-weight: 600; background: var(--card2); color: var(--muted); border: 1px solid var(--border); border-radius: 99px; padding: 6px 16px; transition: all .2s; }
  .done-btn:hover { border-color: var(--accent); color: var(--text); }
  .done-btn.on { background: rgba(52,211,153,.15); border-color: var(--good); color: var(--good); }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; padding: 10px 14px; color: var(--accent); font-size: 12px; letter-spacing: .8px; text-transform: uppercase; border-bottom: 1px solid var(--border); }
  td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: #c7d2e4; }
  tr:last-child td { border-bottom: none; }
  td:first-child { font-weight: 700; color: var(--text); }

  /* ---------- Hierarchy diagram ---------- */
  .hier { margin: 16px 0; }
  .hier-box { border: 2px solid; border-radius: 12px; padding: 12px 16px; margin: 10px 0; text-align: center; }
  .hier-box .hb-t { font-size: 14px; font-weight: 800; }
  .hier-box .hb-d { font-size: 11.5px; opacity: .85; }
  .hb-cpu { border-color: var(--accent); color: var(--accent); background: rgba(108,140,255,.08); }
  .hb-core { border-color: var(--accent2); color: var(--accent2); background: rgba(45,212,191,.07); }
  .hb-proc { border-color: #fbbf24; color: #fbbf24; background: rgba(251,191,36,.07); }
  .hb-thr { border-color: #f87171; color: #f87171; background: rgba(248,113,113,.07); }
  .hier-cores { display: flex; gap: 10px; }
  .hier-cores .hier-box { flex: 1; }
  .hier-arrow { text-align: center; color: var(--muted); font-size: 18px; margin: 2px 0; }
  .hier-procs { display: flex; gap: 10px; }
  .hier-procs .hier-box { flex: 1; }
  .hier-thrs { display: flex; gap: 8px; }
  .hier-thrs .hier-box { flex: 1; padding: 8px 6px; }

  .fc-stage { perspective: 1200px; margin: 18px 0; }
  .fc-card { position: relative; width: 100%; min-height: 220px; cursor: pointer; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.4,1.4,.6,1); }
  .fc-card.flip { transform: rotateY(180deg); }
  .fc-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: var(--radius); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 34px; text-align: center; }
  .fc-front { background: linear-gradient(135deg, #1a2338, #151c2c); }
  .fc-back { background: linear-gradient(135deg, #12312e, #0f2622); transform: rotateY(180deg); border-color: rgba(45,212,191,.35); }
  .fc-q { font-size: 18px; font-weight: 700; }
  .fc-a { font-size: 15px; color: #b9e8dd; }
  .fc-hint { position: absolute; bottom: 14px; font-size: 10.5px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .fc-nav { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .fc-count { font-size: 12.5px; color: var(--muted); font-weight: 600; min-width: 60px; text-align: center; }

  .q-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; }
  .q-text { font-size: 15px; font-weight: 700; margin-bottom: 13px; }
  .q-num { color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: 1px; display: block; margin-bottom: 4px; }
  .opt { display: block; width: 100%; text-align: left; cursor: pointer; background: var(--bg2); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 11px 15px; margin-bottom: 8px; font-size: 14px; font-family: inherit; transition: all .15s; }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--card2); }
  .opt:disabled { cursor: default; opacity: .85; }
  .opt.correct { border-color: var(--good); background: rgba(52,211,153,.12); color: var(--good); font-weight: 700; }
  .opt.wrong { border-color: var(--bad); background: rgba(248,113,113,.1); color: var(--bad); }
  .expl { display: none; margin-top: 10px; font-size: 13px; color: var(--muted); background: var(--bg2); border-left: 3px solid var(--accent); padding: 10px 14px; border-radius: 0 8px 8px 0; }
  .expl.show { display: block; }
  .quiz-score { display: none; text-align: center; padding: 24px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin-top: 18px; }
  .quiz-score .big { font-size: 40px; font-weight: 800; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .quiz-score .msg { color: var(--muted); font-size: 14px; margin-top: 4px; }

  .footer-note { margin-top: 50px; text-align: center; color: var(--muted); font-size: 12px; }
  .reset-link { color: var(--bad); cursor: pointer; text-decoration: underline; background: none; border: none; font-size: 12px; }
  @media (max-width: 640px) {
    .topbar h1 { font-size: 13px; }
    .sec-head h2 { font-size: 18px; }
    .hier-cores, .hier-procs, .hier-thrs { flex-direction: column; }
  }
</style>
</head>
<body>
