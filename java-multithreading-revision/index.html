<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java Multithreading — Revision Index | Engineering Digest</title>
<style>
  :root {
    --bg: #0b0f17; --bg2: #111827; --card: #151c2c; --card2: #1a2338;
    --border: #263148; --text: #e6edf7; --muted: #93a1b8;
    --accent: #6c8cff; --accent2: #2dd4bf; --good: #34d399;
    --bad: #f87171; --warn: #fbbf24; --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 40px 20px 80px; }

  .hero { text-align: center; margin-bottom: 36px; }
  .hero h1 {
    font-size: 28px; font-weight: 800;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .hero .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }

  .stats { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-bottom: 34px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 26px; text-align: center; min-width: 110px; }
  .stat .v { font-size: 22px; font-weight: 800; color: var(--accent2); }
  .stat .l { font-size: 10.5px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }

  .track { height: 8px; background: var(--bg2); border: 1px solid var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 34px; }
  .track-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .4s; }

  .vid {
    display: flex; align-items: center; gap: 16px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 18px; margin-bottom: 10px;
    transition: border-color .2s;
  }
  .vid:hover { border-color: var(--accent); }
  .vid.done { border-color: rgba(52,211,153,.45); }
  .num {
    font-size: 13px; font-weight: 800; color: var(--accent);
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 9px; padding: 6px 11px; min-width: 44px; text-align: center;
  }
  .vid.done .num { color: var(--good); border-color: rgba(52,211,153,.4); background: rgba(52,211,153,.08); }
  .vinfo { flex: 1; min-width: 0; }
  .vtitle { font-size: 14.5px; font-weight: 700; }
  .vmeta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .vstatus { font-size: 11px; font-weight: 700; letter-spacing: .5px; white-space: nowrap; }
  .vstatus.pending { color: var(--muted); }
  .vstatus.ready { color: var(--accent2); }
  .vstatus.now { color: var(--warn); }
  a.vlink {
    display: inline-block; font-size: 12px; font-weight: 700;
    background: linear-gradient(90deg, var(--accent), #8b5cf6); color: white;
    border-radius: 8px; padding: 7px 14px; text-decoration: none;
  }
  .footer { margin-top: 46px; text-align: center; color: var(--muted); font-size: 12px; }
  .reset-link { color: var(--bad); cursor: pointer; text-decoration: underline; background: none; border: none; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>Java Multithreading — Revision</h1>
    <div class="sub">Engineering Digest • 21 Videos • Interactive Notes</div>
  </div>

  <div class="stats">
    <div class="stat"><div class="v" id="st-done">0</div><div class="l">Done</div></div>
    <div class="stat"><div class="v" id="st-ready">0</div><div class="l">Notes Ready</div></div>
    <div class="stat"><div class="v">21</div><div class="l">Total</div></div>
  </div>
  <div class="track"><div class="track-fill" id="track-fill"></div></div>

  <div id="list"></div>

  <div class="footer">
    Progress browser mein save hota hai •
    <button class="reset-link" onclick="resetAll()">Reset progress</button>
  </div>
</div>

<script>
const KEY = 'mt-revision-index-v1';

// file: null = notes abhi nahi bani; agar file hai toh link active hoga
const VIDEOS = [
  { n: 1,  t: 'Multithreading Basics: CPU, Core, Program, Process, Thread & much more', file: '01-basics-cpu-core-process-thread.html' },
  { n: 2,  t: 'How JVM handles multithreading?', file: '02-jvm-handles-multithreading.html' },
  { n: 3,  t: 'Java Threads Made SUPER EASY! 2 Ways to Create Threads', file: '03-creating-threads.html' },
  { n: 4,  t: 'Java Thread Lifecycle EXPLAINED!', file: '04-thread-lifecycle.html' },
  { n: 5,  t: 'Java Thread vs Runnable: The SHOCKING Truth!', file: '05-thread-vs-runnable.html' },
  { n: 6,  t: 'Master Java Threads: Essential Methods', file: '06-essential-thread-methods.html' },
  { n: 7,  t: 'Master Synchronization & the synchronized Keyword', file: '07-synchronization.html' },
  { n: 8,  t: 'Java Locks Explained! ReentrantLock', file: '08-locks-reentrantlock.html' },
  { n: 9,  t: "Understand Locks' Fairness: Prevent Deadlocks", file: null },
  { n: 10, t: 'ReadWriteLock Made SUPER Easy!', file: null },
  { n: 11, t: 'Java Deadlock Explained: Why Your Code is Stuck', file: null },
  { n: 12, t: 'Master Java Thread Communication like a PRO', file: null },
  { n: 13, t: 'Java Thread Safety Explained in 2 Minutes!', file: null },
  { n: 14, t: 'Java Lambda Made EASY!', file: null },
  { n: 15, t: 'Java Thread Pool Explained in 4 Minutes!', file: null },
  { n: 16, t: 'Java Executor Framework Mastery!', file: null },
  { n: 17, t: 'Java CountDownLatch Explained in 10 Minutes!', file: null },
  { n: 18, t: 'Java CyclicBarrier Explained in 10 Minutes!', file: null },
  { n: 19, t: 'Java CompletableFuture Explained in 10 Minutes!', file: null },
  { n: 20, t: 'Volatile vs Atomic in Java: Thread Safety', file: null },
  { n: 21, t: 'Thank You', file: null }
];

// Practice Lab — hands-on coding exercises (growing as videos progress)
const PRACTICE = {
  ready: true,
  file: 'practice.html',
  t: 'Practice Lab — 8 hands-on coding exercises (Videos 1-7 concepts)',
  doneKey: 'p'
};

let state = JSON.parse(localStorage.getItem(KEY) || '{}');
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

const list = document.getElementById('list');
VIDEOS.forEach(v => {
  const row = document.createElement('div');
  row.className = 'vid' + (state[v.n] ? ' done' : '');
  row.id = 'vid-' + v.n;

  let statusHtml, actionHtml;
  if (v.file) {
    statusHtml = '<span class="vstatus ready">READY ✓</span>';
    actionHtml = '<a class="vlink" href="' + v.file + '">Open →</a>';
  } else {
    statusHtml = '<span class="vstatus pending">PENDING</span>';
    actionHtml = '';
  }

  row.innerHTML =
    '<div class="num">' + String(v.n).padStart(2, '0') + '</div>' +
    '<div class="vinfo"><div class="vtitle">' + v.t + '</div>' +
    '<div class="vmeta">Video ' + v.n + ' of 21</div></div>' +
    statusHtml + actionHtml;
  list.appendChild(row);

  // Practice Lab card — Video 7 ke baad insert hota hai
  if (v.n === 7 && PRACTICE.ready) {
    const pc = document.createElement('div');
    pc.className = 'vid';
    pc.style.cssText = 'border-color: rgba(45,212,191,.5); cursor: pointer;';
    pc.onclick = () => location.href = PRACTICE.file;
    pc.innerHTML =
      '<div class="num" style="color:#2dd4bf;border-color:rgba(45,212,191,.5);background:rgba(45,212,191,.08);">⚡</div>' +
      '<div class="vinfo"><div class="vtitle">' + PRACTICE.t + '</div>' +
      '<div class="vmeta">Hands-on coding • IDE mein khud likho</div></div>' +
      '<span class="vstatus ready" style="color:#2dd4bf;">PRACTICE →</span>';
    list.appendChild(pc);
  }
});

// done toggle: title click karke mark/unmark (sirf ready files ke liye meaningful, par sab pe chalega)
list.querySelectorAll('.vid').forEach(row => {
  const n = parseInt(row.id.replace('vid-', ''));
  row.querySelector('.vinfo').style.cursor = 'pointer';
  row.querySelector('.vinfo').addEventListener('click', () => {
    state[n] = !state[n];
    row.classList.toggle('done', !!state[n]);
    save();
    update();
  });
});

function update() {
  const done = Object.values(state).filter(Boolean).length;
  const ready = VIDEOS.filter(v => v.file).length;
  document.getElementById('st-done').textContent = done;
  document.getElementById('st-ready').textContent = ready;
  document.getElementById('track-fill').style.width = Math.round(done / VIDEOS.length * 100) + '%';
}
function resetAll() {
  if (confirm('Sara progress reset karna hai?')) {
    localStorage.removeItem(KEY);
    location.reload();
  }
}
update();
</script>
</body>
</html>
